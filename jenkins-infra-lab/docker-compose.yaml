name: jenkins-lab
services:
  jenkins:
    build: ./jenkins
    container_name: jenkins
    ports:
      - "8080:8080"
    environment:
      AWS_PROFILE: danilaws
      AWS_REGION: eu-central-1
    volumes:
      - jenkins_home:/var/jenkins_home
      - ${USERPROFILE}/.aws:/var/jenkins_home/.aws
    restart: unless-stopped

volumes:
  jenkins_home: