---
- name: Verify the k3s cluster
  hosts: k3s_server
  become: true
  gather_facts: false

  tasks:
    - name: Wait until the node reports Ready
      ansible.builtin.command: /usr/local/bin/k3s kubectl wait --for=condition=Ready node --all --timeout=60s
      register: node_ready
      until: node_ready.rc == 0
      retries: 20
      delay: 10
      changed_when: false

    - name: Wait until the system services are available
      ansible.builtin.command: /usr/local/bin/k3s kubectl -n kube-system wait --for=condition=Available deployment --all --timeout=60s
      register: system_ready
      until: system_ready.rc == 0
      retries: 20
      delay: 10
      changed_when: false

    - name: Get the cluster overview
      ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes -o wide
      register: cluster
      changed_when: false

    - name: Show the cluster
      ansible.builtin.debug:
        var: cluster.stdout_lines